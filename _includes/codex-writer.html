<!-- The Codex writer. Hidden until its script runs; without script the page reads as before. -->
<div class="codex-writer" id="codex-writer" hidden>
  <div class="cw-build">
    <div class="cw-phases"></div>
    <button type="button" class="cw-add">Add a phase</button>
    <fieldset class="cw-ends">
      <legend>End</legend>
      <label><input type="radio" name="cw-end" value="⟩⟩" checked> <span>⟩⟩ Released</span></label>
      <label><input type="radio" name="cw-end" value="⟩"> <span>⟩ Finished</span></label>
      <label><input type="radio" name="cw-end" value="~"> <span>~ Ongoing</span></label>
      <label><input type="radio" name="cw-end" value="×"> <span>× Abandoned</span></label>
    </fieldset>
    <label class="cw-label">Name of the work <input type="text" class="cw-name" placeholder="projects.name" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="cw-result">
    <div class="cw-seal"></div>
    <output class="cw-string" aria-live="polite"></output>
    <div class="cw-actions">
      <button type="button" class="cw-copy">Copy the Codex</button>
      <button type="button" class="cw-save">Save the seal</button>
    </div>
  </div>
</div>
