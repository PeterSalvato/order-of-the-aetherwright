title: "Order of the Ætherwright"
description: "A practice for people who make things: eight glyphs name the domains of creative work, and the Codex records how each work was made."
url: "https://aetherwright.com"
baseurl: ""
author: "Peter Salvato"

collections:
  doctrine:
    output: true
    permalink: /doctrine/:path/

defaults:
  - scope:
      path: ""
      type: "doctrine"
    values:
      layout: "doctrine"

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - license.md
  - CITATION.cff
  - ip_declaration.md
  - changelog.md
  - authors.md
  - metadata.yaml
  - doctrine/
  - tools/
  - node_modules/
  - vendor/
